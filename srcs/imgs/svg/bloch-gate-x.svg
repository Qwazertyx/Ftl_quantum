<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="axis" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="axhi" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="arc" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/></marker>
  </defs>

  <rect x="8" y="8" width="364" height="364" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="190" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Pauli&#8209;X &#8212; 180&#176; about the x axis</text>

  <circle cx="180" cy="185" r="125" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <path d="M55,185 A125,62.5 0 0 1 305,185" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M55,185 A125,62.5 0 0 0 305,185" fill="none" stroke="#94a3b8" stroke-width="1.4"/>

  <line x1="180" y1="325" x2="180" y2="50" stroke="#64748b" stroke-width="1.4" marker-end="url(#axis)"/>
  <line x1="55" y1="185" x2="322" y2="185" stroke="#64748b" stroke-width="1.4" marker-end="url(#axis)"/>
  <!-- x axis highlighted (rotation axis) -->
  <line x1="180" y1="185" x2="263" y2="122" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 4"/>
  <line x1="180" y1="185" x2="93" y2="251" stroke="#2563eb" stroke-width="2.2" marker-end="url(#axhi)"/>

  <!-- rotation trajectory |0> -> |1> around x (right semicircle) -->
  <path d="M180,60 A125,125 0 0 1 180,310" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arc)"/>

  <circle cx="180" cy="60"  r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
  <circle cx="180" cy="310" r="4.5" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>

  <text x="180" y="46" text-anchor="middle" font-size="15" fill="#334155">|0&#10217;</text>
  <text x="180" y="345" text-anchor="middle" font-size="15" fill="#334155">|1&#10217;</text>
  <text x="316" y="180" font-size="12" fill="#94a3b8">|+i&#10217;</text>
  <text x="16"  y="180" font-size="12" fill="#94a3b8">|&#8722;i&#10217;</text>
  <text x="70"  y="268" font-size="13" fill="#2563eb" font-weight="600">x</text>

  <text x="190" y="360" text-anchor="middle" font-size="12" fill="#64748b">X : |0&#10217; &#8596; |1&#10217;  (quantum NOT)</text>
</svg>
